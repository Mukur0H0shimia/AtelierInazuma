<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu 3D — Atelier Maillots</title>
<style>
  html, body { margin: 0; height: 100%; background: #23262d; color: #e8e8e8; font: 14px "Segoe UI", Arial, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panneau { position: absolute; top: 12px; left: 12px; background: rgba(20, 22, 27, .85); padding: 12px 14px; border-radius: 8px; width: 250px; }
  #panneau h1 { font-size: 15px; margin: 0 0 8px; }
  .ligne { margin: 8px 0 4px; color: #aab; font-size: 12px; }
  button { background: #3a3f4b; color: #eee; border: 1px solid #555b68; border-radius: 5px; padding: 5px 9px; margin: 2px 2px 2px 0; cursor: pointer; font: inherit; font-size: 13px; }
  button:hover { background: #4a5060; }
  button.actif { background: #2f6fd6; border-color: #4f8ff6; }
  select { background: #3a3f4b; color: #eee; border: 1px solid #555b68; border-radius: 5px; padding: 4px; font: inherit; }
  #etat { margin-top: 10px; font-size: 12px; color: #9fd49f; }
  #etat.erreur { color: #ff9b8a; }
  #aide { position: absolute; bottom: 10px; left: 12px; font-size: 12px; color: #8a90a0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panneau">
  <h1 id="titre">Aperçu 3D</h1>
  <div class="ligne">Vue</div>
  <button data-vue="0">Devant</button><button data-vue="3.14159">Dos</button><button data-vue="1.5708">Côté</button>
  <label style="display:block;margin-top:6px"><input type="checkbox" id="tourne"> Tourner tout seul</label>
  <div class="ligne">Maillot</div>
  <button id="b_dom" class="actif">Domicile</button><button id="b_ext">Extérieur</button>
  <div class="ligne">Col</div>
  <button data-col="" >Aucun</button><button data-col="col10" class="actif">Col 1</button><button data-col="col11">Col 2</button>
  <div class="ligne">Corpulence</div>
  <select id="corps"></select>
  <div id="etat">Connexion à l'atelier…</div>
</div>
<div id="aide">Clic gauche + glisser : tourner · molette : zoomer · clic droit + glisser : monter / descendre</div>
<script>
"use strict";
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: true }) || cv.getContext('webgl', { antialias: true });
const etatEl = document.getElementById('etat');
function etat(t, err) { etatEl.textContent = t; etatEl.className = err ? 'erreur' : ''; }
if (!gl) etat("Ton navigateur ne gère pas la 3D (WebGL).", true);
const GL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;

// ---------------------------------------------------------------- shaders
const VS = `attribute vec3 p; attribute vec3 n; attribute vec2 t; uniform mat4 mvp;
varying vec3 vn; varying vec2 vt; void main(){ gl_Position = mvp * vec4(p, 1.0); vn = n; vt = t; }`;
const FS = `precision mediump float; varying vec3 vn; varying vec2 vt; uniform sampler2D tex; uniform vec3 lum; uniform float aTex;
void main(){ vec3 c = aTex > 0.5 ? texture2D(tex, vt).rgb : vec3(0.6);
  float d = abs(dot(normalize(vn), normalize(lum)));
  gl_FragColor = vec4(c * (0.42 + 0.62 * d), 1.0); }`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const L = { p: gl.getAttribLocation(prog, 'p'), n: gl.getAttribLocation(prog, 'n'), t: gl.getAttribLocation(prog, 't'),
  mvp: gl.getUniformLocation(prog, 'mvp'), lum: gl.getUniformLocation(prog, 'lum'), aTex: gl.getUniformLocation(prog, 'aTex'),
  tex: gl.getUniformLocation(prog, 'tex') };

// ---------------------------------------------------------------- maillage
let parties = {};
function normales(p, idx) {
  const n = new Float32Array(p.length);
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
    const ux = p[b] - p[a], uy = p[b + 1] - p[a + 1], uz = p[b + 2] - p[a + 2];
    const vx = p[c] - p[a], vy = p[c + 1] - p[a + 1], vz = p[c + 2] - p[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    for (const k of [a, b, c]) { n[k] += nx; n[k + 1] += ny; n[k + 2] += nz; }
  }
  return n;
}
function tampon(data, cible) { const b = gl.createBuffer(); gl.bindBuffer(cible || gl.ARRAY_BUFFER, b);
  gl.bufferData(cible || gl.ARRAY_BUFFER, data, gl.STATIC_DRAW); return b; }
function chargerModele(m) {
  for (const k in parties) { const x = parties[k]; gl.deleteBuffer(x.bp); gl.deleteBuffer(x.bn); gl.deleteBuffer(x.bt); gl.deleteBuffer(x.bi); }
  parties = {};
  for (const k in m.parties) {
    const s = m.parties[k];
    const p = new Float32Array(s.p);
    parties[k] = { bp: tampon(p), bn: tampon(normales(p, s.i)), bt: tampon(new Float32Array(s.t)),
      bi: tampon(new Uint16Array(s.i), gl.ELEMENT_ARRAY_BUFFER), n: s.i.length };
  }
}

// ---------------------------------------------------------------- textures
const textures = {};       // 'haut' / 'short' -> {tex, version}
function texture(nom, url, version) {
  const img = new Image();
  img.onload = () => {
    let t = textures[nom] && textures[nom].tex;
    if (!t) t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    const pot = (img.width & (img.width - 1)) === 0 && (img.height & (img.height - 1)) === 0;
    if (GL2 || pot) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }
    else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    textures[nom] = { tex: t, version: version };
    etat('Mis à jour à ' + new Date().toLocaleTimeString());
    dessiner();
  };
  img.onerror = () => { if (textures[nom]) textures[nom].version = ''; };
  img.src = url;
}

// ---------------------------------------------------------------- caméra
let yaw = 0, pitch = 0.08, dist = 2.3, hauteur = 0.72, cible = 0, auto = false;
function perspective(f, a, n, l) { const t = 1 / Math.tan(f / 2);
  return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (l + n) / (n - l), -1, 0, 0, 2 * l * n / (n - l), 0]; }
function mul(a, b) { const r = new Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; r[i * 4 + j] = s; }
  return r; }
function regarder(e, c) {
  let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = zz, xy = 0, xz = -zx; l = Math.hypot(xx, xy, xz) || 1; xx /= l; xz /= l;   // haut = (0,1,0)
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return [xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1];
}
let cote = 'dom', col = 'col10';
function dessiner() {
  const w = cv.clientWidth * devicePixelRatio | 0, h = cv.clientHeight * devicePixelRatio | 0;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.137, 0.149, 0.176, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  const e = [Math.sin(yaw) * Math.cos(pitch) * dist, hauteur + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist];
  const mvp = mul(perspective(0.6, w / Math.max(1, h), 0.05, 20), regarder(e, [0, hauteur, 0]));
  gl.uniformMatrix4fv(L.mvp, false, new Float32Array(mvp));
  gl.uniform3f(L.lum, e[0] + 0.6, e[1] + 1.2 - hauteur, e[2]);
  gl.uniform1i(L.tex, 0); gl.activeTexture(gl.TEXTURE0);
  for (const k in parties) {
    if (k.startsWith('col') && k !== col) continue;
    const x = parties[k], tn = k === 'short' ? 'short' : 'haut';
    const t = textures[tn] && textures[tn].tex;
    gl.uniform1f(L.aTex, t ? 1 : 0);
    gl.bindTexture(gl.TEXTURE_2D, t || null);
    gl.bindBuffer(gl.ARRAY_BUFFER, x.bp); gl.enableVertexAttribArray(L.p); gl.vertexAttribPointer(L.p, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, x.bn); gl.enableVertexAttribArray(L.n); gl.vertexAttribPointer(L.n, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, x.bt); gl.enableVertexAttribArray(L.t); gl.vertexAttribPointer(L.t, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, x.bi);
    gl.drawElements(gl.TRIANGLES, x.n, gl.UNSIGNED_SHORT, 0);
  }
}
let anime = null;
function boucle() { if (auto) { yaw += 0.012; dessiner(); } anime = requestAnimationFrame(boucle); }
boucle();
addEventListener('resize', dessiner);

// souris
let glisse = null;
cv.addEventListener('mousedown', ev => { glisse = { x: ev.clientX, y: ev.clientY, b: ev.button }; ev.preventDefault(); });
cv.addEventListener('contextmenu', ev => ev.preventDefault());
addEventListener('mouseup', () => glisse = null);
addEventListener('mousemove', ev => {
  if (!glisse) return;
  const dx = ev.clientX - glisse.x, dy = ev.clientY - glisse.y; glisse.x = ev.clientX; glisse.y = ev.clientY;
  if (glisse.b === 2) hauteur = Math.max(0, Math.min(1.5, hauteur + dy * 0.003));
  else { yaw -= dx * 0.01; pitch = Math.max(-1.3, Math.min(1.3, pitch + dy * 0.01)); }
  dessiner();
});
cv.addEventListener('wheel', ev => { dist = Math.max(0.4, Math.min(6, dist * (ev.deltaY > 0 ? 1.1 : 0.9))); dessiner(); ev.preventDefault(); }, { passive: false });

// boutons
function activer(groupe, b) { groupe.forEach(x => x.classList.toggle('actif', x === b)); }
document.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => { yaw = parseFloat(b.dataset.vue); pitch = 0.08; dessiner(); });
document.getElementById('tourne').onchange = ev => { auto = ev.target.checked; };
const bDom = document.getElementById('b_dom'), bExt = document.getElementById('b_ext');
bDom.onclick = () => { cote = 'dom'; activer([bDom, bExt], bDom); textures.haut && (textures.haut.version = ''); textures.short && (textures.short.version = ''); verifier(); };
bExt.onclick = () => { cote = 'ext'; activer([bDom, bExt], bExt); textures.haut && (textures.haut.version = ''); textures.short && (textures.short.version = ''); verifier(); };
const bCols = [...document.querySelectorAll('[data-col]')];
bCols.forEach(b => b.onclick = () => { col = b.dataset.col; activer(bCols, b); dessiner(); });
const selCorps = document.getElementById('corps');
for (let i = 1; i <= 8; i++) { const o = document.createElement('option'); o.value = i; o.textContent = 'Corps ' + i; selCorps.appendChild(o); }
selCorps.onchange = () => fetch('/corps?n=' + selCorps.value).then(verifier);

// ---------------------------------------------------------------- suivi de l'atelier
let vModele = -1, enCours = false;
async function verifier() {
  if (enCours) return; enCours = true;
  try {
    const r = await fetch('/etat', { cache: 'no-store' }); const s = await r.json();
    document.getElementById('titre').textContent = s.titre || 'Aperçu 3D';
    document.title = (s.titre ? s.titre + ' — ' : '') + 'Aperçu 3D';
    if (String(s.corps) !== selCorps.value) selCorps.value = s.corps;
    if (s.erreur) etat(s.erreur, true);
    if (s.modele !== vModele && s.modele > 0) {
      const m = await (await fetch('/modele', { cache: 'no-store' })).json();
      chargerModele(m); vModele = s.modele;
      if (m.haut) { hauteur = (m.bas + m.haut) / 2; dist = Math.max(1.2, (m.haut - m.bas) * 1.95); }   // cadrage selon la taille du corps
      dessiner();
    }
    for (const nom of ['haut', 'short']) {
      const k = nom + '_' + cote, v = s.tex[k];
      if (v && (!textures[nom] || textures[nom].version !== v)) {
        if (!textures[nom]) textures[nom] = { tex: null, version: v }; else textures[nom].version = v;
        texture(nom, '/tex/' + k + '?v=' + encodeURIComponent(v), v);
      }
    }
    if (!s.tex['haut_' + cote]) etat("Préparation des images du maillot…");
  } catch (e) {
    etat("L'atelier est fermé : relance-le puis « Aperçu 3D ».", true);
  } finally { enCours = false; }
}
setInterval(verifier, 400);
verifier();
</script>
</body>
</html>
